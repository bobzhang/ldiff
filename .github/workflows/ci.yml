name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        moonbit: [latest, pre-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit }}"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: check and test
        run: |
          moon update
          moon fmt --check
          moon check --target all --deny-warn
          moon test --target all
          moon info
          git diff --exit-code -- pkg.generated.mbti
